name: Nasazení na Azure Static Web Apps

# Portál i API jedou v jedné Static Web App. Produkty jsou součástí portálu
# (vlastní cesta a vzhled, ne vlastní build), takže se nasazuje jedna aplikace.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      without_api:
        # Diagnostika: nasadí jen web do prostředí `diagnostika`, bez API.
        # Projde-li, chyba je v balíčku API; spadne-li taky, je na straně
        # Azure nebo Static Web App (doc/wiki/operations/deployment.md).
        description: 'Diagnostika – nasadit jen web (bez API) do prostředí "diagnostika"'
        type: boolean
        default: false
      client_version:
        # Verze binárky StaticSitesClient, kterou si SWA CLI stáhne. CLI sám bere
        # `stable` (21. 5. 2026) – s ní od června padá nasazení na „An unknown exception
        # has occurred" (Azure/static-web-apps#1750). `latest` je novější build.
        description: 'Verze nasazovacího klienta StaticSitesClient'
        type: choice
        options: [latest, stable, backup]
        default: latest

concurrency:
  # Dvě souběžná nasazení do stejného prostředí by si přepsala výsledek.
  group: swa-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  # Nezdokumentovaná proměnná SWA CLI (core/deploy-client.js) – vybírá verzi binárky
  # StaticSitesClient. Push a pull request vstupy nemají, platí pro ně `latest`.
  SWA_CLI_DEPLOY_BINARY_VERSION: ${{ inputs.client_version || 'latest' }}

jobs:
  build_and_deploy:
    name: Sestavit a nasadit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 – stejná verze jako runtime funkcí (`apiRuntime` ve staticwebapp.config.json).
      # Node 20 Azure Functions přestaly podporovat 30. 4. 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Kontroly
        run: |
          npm run typecheck
          npm run lint
          npm run test

      # Pojistka: kdyby se testy přestaly nacházet, `node --test` by skončil
      # s nulou testů a kódem 0 – tedy tiše. Nasadit neověřené API je horší
      # než spadlý build.
      - name: Testy opravdu proběhly
        run: |
          COUNT=$(npm run test --workspace apps/api 2>&1 | grep -oP '^# pass \K\d+' | tail -1)
          echo "prošlo testů: ${COUNT:-0}"
          [ "${COUNT:-0}" -ge 60 ] || { echo "Testů proběhlo příliš málo."; exit 1; }

      - name: Build webu
        run: npm run build

      - name: Build API
        # Spojí workspace balíčky do jednoho souboru – `npm install` na Azure
        # by `@fridrich/shared` nenašel, na npm není.
        run: npm run build:api

      # Co přesně jde na Azure – při chybě nasazení je to první, co je potřeba vědět.
      - name: Obsah balíčků
        run: |
          echo "web: $(find apps/portal/dist -type f | wc -l) souborů, $(du -sh apps/portal/dist | cut -f1)"
          echo "api: $(find apps/api/deploy -type f | wc -l) souborů, $(du -sh apps/api/deploy | cut -f1)"
          ls -la apps/api/deploy
          cat apps/api/deploy/package.json

      # Deployment token bez bílých znaků.
      #
      # Secret vložený do GitHubu se zalomením řádku na konci rozbil HTTP hlavičku
      # `Authorization: token …⏎` – StaticSitesClient `stable` to hlásil jen jako
      # „An unknown exception has occurred", teprve `latest` ukázal FormatException.
      # Nasazení kvůli tomu padalo od září 2026 (doc/wiki/operations/deployment.md).
      - name: Deployment token
        env:
          RAW_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "Chybí secret AZURE_STATIC_WEB_APPS_API_TOKEN."
            exit 1
          fi
          if [ "$TOKEN" != "$RAW_TOKEN" ]; then
            echo "::warning::Secret AZURE_STATIC_WEB_APPS_API_TOKEN obsahuje bílé znaky (zalomení řádku) – ořezáno. Uložte ho znovu bez nich."
          fi
          echo "::add-mask::$TOKEN"
          echo "SWA_CLI_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Nasazuje SWA CLI, ne akce Azure/static-web-apps-deploy@v1 – ta neumí
      # přeskočit build API (`skip_api_build` mezi její vstupy nepatří), takže
      # se pokoušela znovu sestavit balíček, který už hotový je. CLI nahraje, co
      # dostane; `--verbose=silly` ukáže ID nasazení a detail výjimky klienta.
      - name: Nasazení
        if: ${{ !inputs.without_api }}
        env:
          # U pull requestu jde build do vlastního prostředí, ať produkce zůstane.
          ENV_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
        run: |
          npx -y @azure/static-web-apps-cli@2 deploy apps/portal/dist \
            --api-location apps/api/deploy \
            --api-language node \
            --api-version 22 \
            --env "$ENV_NAME" \
            --no-use-keychain \
            --verbose=silly

      - name: Diagnostika – nasazení jen webu
        if: ${{ inputs.without_api }}
        run: |
          npx -y @azure/static-web-apps-cli@2 deploy apps/portal/dist \
            --env diagnostika \
            --no-use-keychain \
            --verbose=silly

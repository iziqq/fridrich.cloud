name: Nasazení na Azure Static Web Apps

# Portál i API jedou v jedné Static Web App. Produkty jsou součástí portálu
# (vlastní cesta a vzhled, ne vlastní build), takže se nasazuje jedna aplikace.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  # Dvě souběžná nasazení do stejného prostředí by si přepsala výsledek.
  group: swa-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Sestavit a nasadit
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Kontroly
        run: |
          npm run typecheck
          npm run lint
          npm run test

      # Pojistka: kdyby se testy přestaly nacházet, `node --test` by skončil
      # s nulou testů a kódem 0 – tedy tiše. Nasadit neověřené API je horší
      # než spadlý build.
      - name: Testy opravdu proběhly
        run: |
          COUNT=$(npm run test --workspace apps/api 2>&1 | grep -oP '^# pass \K\d+' | tail -1)
          echo "prošlo testů: ${COUNT:-0}"
          [ "${COUNT:-0}" -ge 60 ] || { echo "Testů proběhlo příliš málo."; exit 1; }

      - name: Build webu
        run: npm run build

      - name: Build API
        # Spojí workspace balíčky do jednoho souboru – `npm install` na Azure
        # by `@fridrich/shared` nenašel, na npm není.
        run: npm run build:api

      - name: Nasazení
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/portal/dist
          api_location: apps/api/deploy
          output_location: ''
          # Obojí je sestavené výš. Build na Azure běží jen v adresáři
          # aplikace a workspace závislosti (@fridrich/*) by nenašel.
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    name: Zrušit preview prostředí
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Zrušení
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
